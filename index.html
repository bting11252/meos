<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1" name="viewport">
<title>MeOS · 一个会"认识你"的个人 Agent 操作系统</title>
<style>
:root{
  --bg:#f2f5fa; --panel:#ffffff; --panel2:#fafbfe; --line:#e2e8f2; --line2:#eef2f8;
  --ink:#14203a; --ink2:#3d4d6b; --mut:#7c8aa5; --faint:#a8b4c8;
  --acc:#4f6ef7; --acc2:#7c5cff; --teal:#0ea5a4; --amber:#f59e0b; --rose:#f43f5e;
  --green:#10b981; --slate:#94a3b8;
  --sh:0 1px 2px rgba(20,32,58,.05),0 8px 24px rgba(20,32,58,.06);
  --sh2:0 2px 6px rgba(20,32,58,.06),0 18px 50px rgba(20,32,58,.12);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Inter","Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column;padding:14px 18px 12px;gap:12px}
.mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:18px;flex:0 0 auto}
.brand{font-size:25px;font-weight:800;letter-spacing:-.6px;display:flex;align-items:baseline;gap:9px}
.brand i{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 0 0 4px rgba(79,110,247,.16);display:inline-block;transform:translateY(-1px)}
.brand small{font-size:11px;font-weight:600;color:var(--acc);background:rgba(79,110,247,.1);
  padding:2px 7px;border-radius:99px;letter-spacing:.3px}
.tag{color:var(--mut);font-size:13.5px;border-left:1px solid var(--line);padding-left:18px;line-height:1.35}
.tag b{color:var(--ink2);font-weight:600}
.spacer{flex:1}
.days{display:flex;gap:6px;align-items:center}
#days{display:flex;gap:6px}
.days .lbl{font-size:11.5px;color:var(--faint);margin-right:2px;letter-spacing:.5px}
.day{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink2);font-weight:700;font-size:13px;cursor:pointer;transition:.16s;display:grid;place-items:center}
.day:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
.day.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(79,110,247,.35)}
.play{border:none;background:linear-gradient(135deg,#14203a,#2c3f66);color:#fff;font-weight:650;font-size:13px;
  padding:0 18px;height:38px;border-radius:10px;cursor:pointer;letter-spacing:.3px;
  box-shadow:0 6px 18px rgba(20,32,58,.22)}
.play.on{background:linear-gradient(135deg,var(--acc),var(--acc2))}

/* ---------- layout ---------- */
main{flex:1 1 auto;display:grid;grid-template-columns:280px 1fr 320px;gap:12px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line2);flex:0 0 auto}
.ph h3{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.4px;color:var(--ink)}
.ph .k{margin-left:auto;font-size:10.5px;color:var(--faint);letter-spacing:.4px}
.pb{padding:12px 14px;overflow:auto;min-height:0;flex:1 1 auto}
.pb::-webkit-scrollbar{width:5px}.pb::-webkit-scrollbar-thumb{background:#d5dce9;border-radius:9px}

/* ---------- agents ---------- */
.agent{border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:8px;
  background:var(--panel2);transition:.28s;position:relative;overflow:hidden}
.agent:last-child{margin-bottom:0}
.agent .top{display:flex;align-items:center;gap:7px}
.agent .nm{font-size:12.5px;font-weight:700}
.agent .ic{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:11px;color:#fff}
.agent .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#d8e0ee;transition:.2s}
.agent .out{font-size:11px;color:var(--mut);line-height:1.5;margin-top:6px}
.agent .out b{color:var(--ink2);font-weight:650}
.agent.live{border-color:var(--acc);background:#f6f8ff;box-shadow:0 6px 20px rgba(79,110,247,.13);transform:translateX(2px)}
.agent.live .dot{background:var(--acc);box-shadow:0 0 0 4px rgba(79,110,247,.18);animation:pulse 1.1s infinite}
.agent.done .dot{background:var(--green)}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(79,110,247,0)}}
.streak{position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--acc),var(--acc2));
  opacity:0;transition:.3s}
.agent.live .streak,.agent.done .streak{opacity:1}

/* ---------- log ---------- */
.logbox{margin-top:10px;border-top:1px solid var(--line2);padding-top:8px}
.logline{font-size:10.5px;line-height:1.5;color:var(--mut);padding:3px 0;
  border-bottom:1px dashed var(--line2);display:flex;gap:6px;animation:sl .3s ease both}
.logline:last-child{border-bottom:none}
.logline b{color:var(--acc);font-weight:650;flex:0 0 auto}
@keyframes sl{from{opacity:0;transform:translateY(-3px)}}

/* ---------- timeline ---------- */
.tl{padding:6px 16px 0}
.hours{display:flex;position:relative;height:17px;margin-bottom:4px}
.hours span{position:absolute;font-size:9.5px;color:var(--faint);transform:translateX(-50%);
  font-family:"JetBrains Mono",monospace}
.track{position:relative;height:34px;margin-bottom:5px;background:var(--panel2);
  border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.track.thin{height:20px}
.gold{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,rgba(245,158,11,.16),rgba(245,158,11,.05));
  border-top:1px dashed rgba(245,158,11,.5);border-bottom:1px dashed rgba(245,158,11,.5)}
.ban{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,
  rgba(148,163,184,.22) 0 5px,rgba(148,163,184,.06) 5px 10px);border-left:1px solid #cbd5e1;border-right:1px solid #cbd5e1}
.bk{position:absolute;top:3px;bottom:3px;border-radius:6px;display:flex;align-items:center;padding:0 6px;
  font-size:10px;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap;cursor:pointer;transition:.15s;
  border:1px solid rgba(255,255,255,.35)}
.bk:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 4px 12px rgba(20,32,58,.22);z-index:3}
.bk.sel{outline:2px solid var(--ink);outline-offset:1px;z-index:4}
.bk.focus{background:linear-gradient(135deg,var(--acc),#6b86ff)}
.bk.focus.creative{background:linear-gradient(135deg,var(--acc2),#9a80ff)}
.bk.buffer{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#4a2c00}
.bk.recovery{background:repeating-linear-gradient(135deg,#cbd5e1 0 6px,#e2e8f0 6px 12px);color:#475569}
.bk.health{background:linear-gradient(135deg,#34d399,#10b981)}
.ab{position:absolute;height:5px;border-radius:3px;opacity:.95}
.ab.done{background:var(--green)}.ab.partial{background:var(--amber)}.ab.skipped{background:var(--rose)}
.legend{display:flex;gap:14px;align-items:center;padding:9px 16px 4px;font-size:10.5px;color:var(--mut);flex-wrap:wrap}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.rationale{margin:8px 16px 0;background:linear-gradient(135deg,#f6f8ff,#fbfaff);border:1px solid #e4e9ff;
  border-left:3px solid var(--acc);border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.6;color:var(--ink2)}
.rationale b{color:var(--acc);font-weight:700}
.detail{margin:8px 16px 12px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
  font-size:11.5px;line-height:1.6;color:var(--ink2);background:var(--panel2);min-height:56px}
.detail .t{font-weight:700;font-size:12px;display:flex;align-items:center;gap:8px}
.detail .m{color:var(--mut);font-size:10.5px;margin-top:3px}
.detail .r{color:var(--acc);margin-top:5px}
.detail .g{color:var(--amber);margin-top:3px}

/* ---------- memory ---------- */
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:11.5px;margin-bottom:3px}
.kv .k{color:var(--mut)}.kv .v{font-weight:700;font-family:"JetBrains Mono",monospace;color:var(--ink)}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0 9px}
.pill{font-size:10px;padding:2.5px 7px;border-radius:99px;font-weight:650;letter-spacing:.2px}
.pill.b{background:rgba(79,110,247,.11);color:#3b5bdb}
.pill.g{background:rgba(16,185,129,.13);color:#0b7a5b}
.pill.a{background:rgba(245,158,11,.15);color:#a5620a}
.pill.r{background:rgba(244,63,94,.12);color:#c02a4b}
.pill.s{background:rgba(148,163,184,.16);color:#5b6a83}
.exp{border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:9px;padding:8px 10px;
  margin-bottom:7px;background:var(--panel2);animation:sl .3s ease both}
.exp .ls{font-size:11.5px;font-weight:700;color:#5b3fd6;line-height:1.5}
.exp .rf{font-size:10.5px;color:var(--mut);line-height:1.55;margin-top:4px}
.exp .sc{font-size:9.5px;color:var(--faint);margin-top:4px;font-family:"JetBrains Mono",monospace}
.vec{width:100%;height:118px;border:1px solid var(--line);border-radius:10px;background:
  radial-gradient(circle at 50% 50%,#fbfcff,#f3f6fc);margin-bottom:8px}

/* ---------- footer ---------- */
footer{flex:0 0 214px;display:grid;grid-template-columns:1.45fr 1fr;gap:12px;min-height:0}
.chartwrap{padding:4px 10px 8px}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:5px 10px;font-size:11.5px;align-items:center}
.cmp .hd{font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.4px}
.cmp .hd.d1{color:var(--rose)}.cmp .hd.d7{color:var(--green)}
.cmp .lb{color:var(--mut)}
.cmp .v{font-weight:750;font-family:"JetBrains Mono",monospace}
.delta{font-size:10px;margin-left:4px;font-weight:700}
.up{color:var(--green)}.down{color:var(--acc)}

/* ---------- subtitle + overlay ---------- */
.sub{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:1180px;
  background:rgba(20,32,58,.9);color:#fff;font-size:15.5px;line-height:1.6;padding:12px 22px;
  border-radius:12px;backdrop-filter:blur(8px);box-shadow:var(--sh2);opacity:0;transition:opacity .35s;
  text-align:center;letter-spacing:.2px;z-index:60;font-weight:500}
.sub.on{opacity:1}
.sub em{font-style:normal;color:#9db4ff;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(238,242,249,.9);backdrop-filter:blur(5px);z-index:50;
  display:none;align-items:center;justify-content:center;padding:46px 60px}
.ov.on{display:flex;animation:fi .4s ease both}
@keyframes fi{from{opacity:0}}
/* 覆盖层内容逐条浮现：静态卡片撑十几秒会让人以为视频卡住了 */
.ovc .blk,.ovc .stat,.ovc table.tt tr,.ovc .pnode,.ovc pre{animation:su .55s cubic-bezier(.22,1,.36,1) both}
.ovc .blk:nth-child(1),.ovc .stat:nth-child(1),.ovc .pnode:nth-child(1){animation-delay:.05s}
.ovc .blk:nth-child(2),.ovc .stat:nth-child(2),.ovc .pnode:nth-child(3){animation-delay:.16s}
.ovc .blk:nth-child(3),.ovc .stat:nth-child(3),.ovc .pnode:nth-child(5){animation-delay:.27s}
.ovc .blk:nth-child(4),.ovc .pnode:nth-child(7){animation-delay:.38s}
.ovc table.tt tr:nth-child(1){animation-delay:.02s}
.ovc table.tt tr:nth-child(2){animation-delay:.10s}
.ovc table.tt tr:nth-child(3){animation-delay:.18s}
.ovc table.tt tr:nth-child(4){animation-delay:.26s}
.ovc table.tt tr:nth-child(5){animation-delay:.34s}
.ovc table.tt tr:nth-child(6){animation-delay:.42s}
.ovc table.tt tr:nth-child(7){animation-delay:.50s}
.ovc table.tt tr:nth-child(8){animation-delay:.58s}
@keyframes su{from{opacity:0;transform:translateY(9px)}}
.ovc{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh2);
  padding:30px 36px;max-width:1400px;width:100%;max-height:100%;overflow:auto}
.ovc h2{margin:0 0 6px;font-size:27px;letter-spacing:-.7px}
.ovc h2 span{color:var(--acc)}
.ovc .sb{color:var(--mut);font-size:13.5px;margin-bottom:20px}
.pipe{display:flex;align-items:stretch;gap:0;margin:8px 0 20px}
.pnode{flex:1;border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;background:var(--panel2);transition:.2s}
.pnode.on{border-color:var(--acc);background:#f5f8ff;box-shadow:0 8px 24px rgba(79,110,247,.14)}
.pnode .pt{font-size:14px;font-weight:750;display:flex;align-items:center;gap:7px}
.pnode .pd{font-size:11.5px;color:var(--mut);line-height:1.55;margin-top:6px}
.pnode .pk{font-size:10.5px;color:var(--acc);margin-top:7px;font-weight:650}
.parrow{display:grid;place-items:center;padding:0 7px;color:var(--faint);font-size:17px}
.memstrip{margin-top:16px;border:1.5px dashed #c9d4e8;border-radius:13px;padding:12px 16px;background:#fafcff}
.memstrip .mt{font-size:12.5px;font-weight:750;margin-bottom:6px}
.memstrip .md{font-size:11.5px;color:var(--mut);line-height:1.6}
pre.prompt{background:#0f1a2e;color:#cfe0ff;border-radius:12px;padding:16px 18px;font-size:11.5px;
  line-height:1.62;overflow:auto;max-height:330px;white-space:pre-wrap;
  font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace}
pre.prompt .g{color:#6ee7b7}.pw{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:14px}
.blk{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px}
.blk .bt{font-size:11.5px;font-weight:750;color:var(--acc);margin-bottom:5px;letter-spacing:.3px}
.blk .bd{font-size:11.5px;color:var(--ink2);line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel2)}
.stat .n{font-size:30px;font-weight:800;letter-spacing:-1.2px;font-family:"Inter",system-ui}
.stat .n.a{color:var(--acc)}.stat .n.g{color:var(--green)}.stat .n.r{color:var(--rose)}
.stat .l{font-size:11.5px;color:var(--mut);margin-top:2px}
.stat .d{font-size:10.5px;color:var(--faint);margin-top:5px;line-height:1.45}
table.tt{width:100%;border-collapse:collapse;font-size:12px}
table.tt th,table.tt td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line2)}
table.tt th{font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.4px}
table.tt td.n{font-family:"JetBrains Mono",monospace;font-weight:700}
.hint{position:fixed;left:336px;bottom:248px;font-size:10.5px;color:var(--faint);
  z-index:20;pointer-events:none;letter-spacing:.2px}
</style>
</head>

  <div class="brand"><i></i>MeOS <small id="ver">v0.1 MVP</small></div>
  <div class="tag">一个会<b>"认识你"</b>的个人 Agent 操作系统 &nbsp;·&nbsp; 感知 → 规划 → 执行 → 复盘 → 进化</div>
  <div class="spacer"></div>
  <div class="days"><span class="lbl">DAY</span><div id="days"></div></div>
  <button class="play" id="play">▶ 自动演示</button>
</header>

<main>
  <!-- 左：四个 Agent -->
  <section class="panel">
    <div class="ph"><h3>AGENT 运行状态</h3><span class="k" id="vtag">画像 v0</span></div>
    <div class="pb">
      <div id="agents"></div>
      <div class="logbox" id="logbox"></div>
    </div>
  </section>

  <!-- 中：时间轴 -->
  <section class="panel">
    <div class="ph"><h3 id="tlTitle">DAY 1 · 今日计划</h3>
      <span class="k" id="tlMeta"></span></div>
    <div class="tl" id="tl"></div>
    <div class="rationale" id="rationale"></div>
    <div class="detail" id="detail"></div>
  </section>

  <!-- 右：记忆库 -->
  <section class="panel">
    <div class="ph"><h3>记忆库 / 用户画像</h3><span class="k" id="memStat"></span></div>
    <div class="pb">
      <svg class="vec" id="vec" viewBox="0 0 300 118"></svg>
      <div class="kv" id="kv"></div>
      <div class="tagrow" id="chips"></div>
      <div id="exps"></div>
    </div>
  </section>
</main>

<footer>
  <section class="panel">
    <div class="ph"><h3>7 天学习曲线</h3><span class="k">数据源：真实运行输出 · 非示意</span></div>
    <div class="chartwrap"><svg id="curve" viewBox="0 0 760 168" style="width:100%; height:164px"></svg></div>
  </section>
  <section class="panel">
    <div class="ph"><h3>DAY 1 vs DAY 7</h3><span class="k">同一套引擎</span></div>
    <div class="pb" style="padding-top:10px"><div class="cmp" id="cmp"></div></div>
  </section>
</footer>

<div class="sub" id="sub"></div>
<div class="ov" id="ov"><div class="ovc" id="ovc"></div></div>
<div class="hint" id="hint">点击日期回放某一天 · 点击时间块查看决策依据</div>

const NARR = {"total":190.36,"segments":[{"id":"intro","start":0.0,"dur":14.38,"text":"这是我用一天时间做的产品：MeOS，一个会认识你的个人 Agent 操作系统。它不是日程表，也不是待办清单。它要回答的是，系统能不能通过观察你建立认知模型，然后用这个模型帮你做更好的决策。"},{"id":"problem","start":14.38,"dur":14.18,"text":"先说结论。第一天，系统对你的产能一无所知，只能按你的乐观假设排满六百三十分钟。结果兑现率只有六成六，最没精神的下午塞满了深度工作，一整天的深度块，只有三分之一能完整做完。"},{"id":"result","start":28.56,"dur":14.18,"text":"第七天，系统只给你排三百二十五分钟，比第一天少了四成八，但兑现率是九成六，五成的深度工作落在高能时段，完整完成的深度块从三分之一升到三分之二。这不是模型变强了，是它认识你了。"},{"id":"arch","start":42.74,"dur":6.77,"text":"支撑这件事的，是四个 Agent 组成的闭环：感知、规划、执行、复盘，以及底下的记忆层。"},{"id":"perception","start":49.51,"dur":11.11,"text":"感知 Agent 把脏数据蒸馏成信号：日历、待办、浏览行为、精力自评，输出可支配时间、高能时段和碎片化程度。它不做判断，只做看见。"},{"id":"planner","start":60.62,"dur":16.85,"text":"规划 Agent 是入口。它先拿今天长什么样，去向量记忆里检索相似的历史经验，把踩过的坑和奏效的模式作为样例注入提示词，再让模型输出策略参数，最后由确定性排程器排出时间轴。语言模型负责决策，代码负责算术。"},{"id":"executor","start":77.47,"dur":14.3,"text":"执行 Agent 拆解任务，针对已预测的卡点提前准备辅助材料，并记录每个时间块的真实耗时。它把系统以为自己做到的，和实际发生的，分开记账。因为学习系统最常见的死法，就是自己骗自己。"},{"id":"reflector","start":91.77,"dur":19.99,"text":"复盘 Agent 是进化引擎。它只从计划和实际的差额里学习，不从情绪里学习。一条硬纪律是：三种失败模式必须分开归因。注意力崩塌学的是深度块上限，任务卡点学的是任务类型，低能时段滑走学的是禁排时段。混在一起学，就会得出健身也会卡住这种荒谬结论。"},{"id":"reflector2","start":111.76,"dur":7.34,"text":"而且时段拉黑需要跨天复现，至少在两个不同的日子失手过。因为一天熬夜，不足以改变你的日程。"},{"id":"day7","start":119.1,"dur":15.26,"text":"你看第七天的计划，每一条都有出处。这段主动留白，来自记忆里那条禁排窗口，下午一点到四点。深度块被拆到七十五分钟以内，因为系统从第一天那次崩塌里学到，你的注意力在九十五分钟之后是断崖式下跌。"},{"id":"trace","start":134.36,"dur":11.98,"text":"这是规划 Agent 当时发出的提示词：上面是画像，也就是它的当前信念，下面是按相似度检索到的历史经验，再下面是模型返回的策略参数。整条链路可以回放。"},{"id":"profile","start":146.34,"dur":12.82,"text":"最终画像长这样：产能系数零点九，缓冲三成，深度块上限七十五分钟，禁用时段下午一点到四点，黄金时段上午十点到十二点、下午五点到六点，创意类卡点概率百分之四十五。"},{"id":"truth","start":159.16,"dur":12.98,"text":"对照上帝视角的真实规律：创意类真实卡点概率百分之五十五，系统估到百分之四十五；深度类真实百分之二十六，系统估到百分之十六。它不只知道你的规律，还知道自己不知道什么。"},{"id":"tradeoff","start":172.14,"dur":18.22,"text":"一天的时间，我放弃了用户系统、权限和移动端，全部押在这条闭环上。只有闭环跑通，才可能出现那个它真的懂我的瞬间。给我一周，我会补上真实数据接入、多日负载均衡和长期记忆的遗忘曲线。但今天，它已经能看着你的一天，说出一句你自己的话。"}]};
const H0 = 540, H1 = 1320;               // 09:00 - 22:00
const AGENTS = [
  {id:'perception',nm:'感知 Agent',ic:'◉',c:'#0ea5a4',role:'采集 → 结构化信号'},
  {id:'planner',   nm:'规划 Agent',ic:'◐',c:'#4f6ef7',role:'检索经验 → 生成计划'},
  {id:'executor',  nm:'执行 Agent',ic:'⚡',c:'#f59e0b',role:'拆解备料 → 记录真实'},
  {id:'reflector', nm:'复盘 Agent',ic:'⟳',c:'#7c5cff',role:'提炼经验 → 升级画像'},
];
const KIND_LABEL = {focus:'深度工作',buffer:'切换缓冲',recovery:'留白/恢复',health:'身体',admin:'事务'};
const $ = s => document.querySelector(s);
const pct = (a,b) => (a-H0)/(H1-H0)*100;
const fmt = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const mm = s => parseInt(s.slice(0,2))*60+parseInt(s.slice(3,5));

let S = {day:1, sel:null, playing:false, timers:[]};

/* ============================ 渲染 ============================ */
function render(){
  const d = DATA.days.find(x=>x.day===S.day);
  S.d = d;
  $('#vtag').textContent = '画像 v'+d.profile.version;
  $('#tlTitle').textContent = 'DAY '+d.day+' · 今日计划';
  $('#tlMeta').textContent = `计划 ${d.plan.planned}min · 兑现 ${d.exec.done}min · 产能系数 ${d.plan.capacity.toFixed(2)}`;
  renderTimeline(d); renderMemory(d); renderAgents(d); renderCurve(); renderCmp(); renderLog(d);
}
function renderTimeline(d){
  let h='<div class="hours">';
  for(let t=H0;t<=H1;t+=60) h+=`<span style="left:${pct(t)}%">${fmt(t)}</span>`;
  h+='</div>';
  // 高能时段与禁用时段作为底纹：这两条恰好就是系统"学会"的东西
  let bg='';
  d.plan.used && 0;
  (d.signal.high||[]).forEach(([a,b])=> bg+=`<div class="gold" style="left:${pct(mm(a))}%;width:${pct(mm(b))-pct(mm(a))}%"></div>`);
  (d.profile.banned_windows||[]).forEach(w=>{
    const [a,b]=w.split('-'); bg+=`<div class="ban" style="left:${pct(mm(a))}%;width:${pct(mm(b))-pct(mm(a))}%"></div>`;});
  const row1 = d.timeline.filter(b=>b.kind==='focus');
  const row2 = d.timeline.filter(b=>b.kind!=='focus');
  let t1 = bg, t2 = '';
  row1.forEach((b,i)=>{
    const l=pct(mm(b.s)), w=Math.max(pct(mm(b.e))-l,2.4);
    t1+=`<div class="bk focus ${b.type}" data-i="${i}" data-k="focus" style="left:${l}%;width:${w}%">${b.title}</div>`;
    const aw = w*Math.min(1.16, b.actual/Math.max(b.cost,1));
    t1+=`<div class="ab ${b.status}" data-i="${i}" data-k="focus" style="left:${l}%;width:${aw}%;bottom:-8px"></div>`;
  });
  row2.forEach((b,i)=>{
    const l=pct(mm(b.s)), w=Math.max(pct(mm(b.e))-l,1.6);
    t2+=`<div class="bk ${b.kind}" data-i="${i}" data-k="side" style="left:${l}%;width:${w}%">${b.kind==='recovery'&&b.title.includes('留白')?'留白':''}</div>`;
  });
  $('#tl').innerHTML = h
    + `<div class="track" style="height:44px;overflow:visible">${t1}</div>`
    + `<div class="track thin">${t2}</div>`
    + `<div class="legend">
        <span><i style="background:linear-gradient(135deg,var(--acc),#6b86ff)"></i>深度/分析</span>
        <span><i style="background:linear-gradient(135deg,var(--acc2),#9a80ff)"></i>创作类</span>
        <span><i style="background:var(--amber)"></i>切换缓冲</span>
        <span><i style="background:#e2e8f0"></i>主动留白</span>
        <span><i style="background:var(--gold,#f59e0b);opacity:.4"></i>高能时段</span>
        <span><i style="background:repeating-linear-gradient(135deg,#cbd5e1 0 4px,#eef2f8 4px 8px)"></i>已学会的禁用时段</span>
        <span><i style="background:var(--green)"></i>实际兑现</span>
        <span><i style="background:var(--rose)"></i>滑走</span>
      </div>`;
  $('#rationale').innerHTML = `<b>规划 Agent 决策说明 · 依据 ${d.plan.used.length} 条历史经验</b><br>${hl(d.plan.rationale)}`;
  $('#tl').querySelectorAll('.bk').forEach(el=>el.onclick=()=>{
    const k=el.dataset.k, i=+el.dataset.i;
    const list = k==='focus'?row1:row2; pick(list[i]);
  });
  pick(row1.find(b=>b.kind==='recovery')||row1[0]);
}
function hl(t){ return (t||'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function pick(b){
  if(!b) return;
  S.sel=b;
  $('#tl').querySelectorAll('.bk').forEach(e=>{
    const list=(e.dataset.k==='focus'?S.d.timeline.filter(x=>x.kind==='focus'):S.d.timeline.filter(x=>x.kind!=='focus'));
    e.classList.toggle('sel', list[+e.dataset.i]===b);
  });
  const st = {done:['已完成','g'],partial:['部分完成','a'],skipped:['滑走','r']}[b.status]||['结构块','s'];
  const flag = {collapse:'注意力崩塌',stuck:'任务卡点',energy:'低能时段滑走',carry:'被上游超时挤占',ok:''}[b.flag]||'';
  $('#detail').innerHTML =
    `<div class="t">${b.s}–${b.e} &nbsp;${b.title}
       <span class="pill ${st[1]}">${st[0]}</span>
       ${flag?`<span class="pill r">${flag}</span>`:''}
       ${b.type==='creative'?'<span class="pill b">创作类</span>':''}
       ${b.kind!=='focus'?`<span class="pill s">${KIND_LABEL[b.kind]||b.kind}</span>`:''}</div>
     <div class="m">计划 ${b.cost}min · 实际投入 ${b.actual}min${b.kind==='focus'?`（兑现率 ${Math.min(100,Math.round(b.actual/b.cost*100))}%）`:''}</div>
     <div class="r">决策依据：${b.reason||'—'}</div>
     ${b.guard?`<div class="g">保护策略：${b.guard}</div>`:''}
     ${b.why?`<div class="g">执行 Agent 记录：${b.why}</div>`:''}
     ${(b.assist&&b.assist.length)?`<div class="r">提前备料：${b.assist[0]}</div>`:''}`;
}
function renderAgents(d){
  const m=d.metrics, e=d.exec;
  const out = {
    perception:`可用 <b>${d.signal.available}min</b> · 会议 ${d.signal.meeting}min · 碎片化 ${Math.round(d.signal.frag*100)}%
      <br>高能 ${(d.signal.high||[]).map(x=>x[0]+'-'+x[1]).join('、')||'无'} · 待办 <b>${d.signal.backlog.length}</b> 项`,
    planner:`策略来源 <b>${d.plan.policySource}</b> · 召回 <b>${(d.recall.hits||[]).length}</b> 条经验
      <br>产能系数 <b>${d.plan.capacity.toFixed(2)}</b> · 缓冲 ${Math.round(d.plan.buffer*100)}% · 深度块上限 <b>${d.plan.maxDeep}min</b>
      <br>排入深度工作 <b>${d.plan.planned}min</b>`,
    executor:`实际投入 <b>${e.actual}min</b> · 兑现 <b>${e.done}min</b>
      <br>计划外流失 ${e.lost}min · 上下文切换 ${e.switches} 次
      <br>备料命中 <b>${d.timeline.filter(b=>b.assist&&b.assist.length).length}</b> 个卡点`,
    reflector:`新增经验 <b>${d.experiences.length}</b> 条 → 画像升级 v<b>${d.profile.version}</b>
      <br>${d.experiences.map(x=>x.lesson.split(' —— ')[0]).join('<br>')||'（今天没有新规则，画像已收敛）'}`,
  };
  $('#agents').innerHTML = AGENTS.map((a,i)=>`
    <div class="agent" id="ag-${a.id}"><div class="streak"></div>
      <div class="top"><div class="ic" style="background:${a.c}">${a.ic}</div>
        <div class="nm">${a.nm}</div><div class="dot"></div></div>
      <div class="out">${out[a.id]}</div></div>`).join('');
}
function renderLog(d){
  $('#logbox').innerHTML = d.log.map(l=>
    `<div class="logline"><b>${l.agent.replace(' Agent','')}</b><span>${l.detail}</span></div>`).join('');
}
function renderMemory(d){
  const p=d.profile, st={cap:'产能系数',buf:'缓冲比例',md:'深度块上限',gold:'黄金时段',ban:'禁用时段'};
  $('#kv').innerHTML = [
    ['画像版本','v'+p.version],['产能系数',p.capacity_ratio.toFixed(2)],
    ['缓冲比例',Math.round(p.buffer_ratio*100)+'%'],['深度块上限',p.max_deep_block+'min'],
    ['情节记忆',DATA.experiences.filter(e=>e.day<=d.day).length+' 条'],
  ].map(([k,v])=>`<div class="k">${k}</div><div class="v">${v}</div>`).join('');
  let chips='';
  (p.banned_windows||[]).forEach(w=>chips+=`<span class="pill r">禁排 ${w}</span>`);
  (p.gold_windows||[]).forEach(w=>chips+=`<span class="pill a">黄金 ${w}</span>`);
  Object.entries(p.stuck_hotspots||{}).filter(([,v])=>v>0.35)
    .forEach(([k,v])=>chips+=`<span class="pill b">卡点 ${k} ${Math.round(v*100)}%</span>`);
  $('#chips').innerHTML = chips || '<span class="pill s">尚未形成稳定画像</span>';
  const exps = DATA.experiences.filter(e=>e.day<=d.day).slice(-3).reverse();
  $('#exps').innerHTML = '<div class="ph" style="padding:9px 0 6px;border:none"><h3>最新情节记忆</h3></div>'+
    exps.map(e=>`<div class="exp"><div class="ls">${e.lesson}</div>
      <div class="rf">${e.reflection}</div><div class="sc">${e.id} · score ${e.score} · ${e.tags.join(' / ')}</div></div>`).join('');
  drawVec(d);
}
function drawVec(d){
  const all = DATA.experiences.filter(e=>e.day<=d.day);
  const hits = (d.recall.hits||[]).map(h=>h.id);
  const cx=150, cy=58;
  let s=`<text x="10" y="14" font-size="9" fill="#a8b4c8">向量记忆库 · 今日召回 ${hits.length} 条</text>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="4" fill="#14203a"/>`;
  s+=`<text x="${cx+8}" y="${cy+3}" font-size="8.5" fill="#7c8aa5">今日场景</text>`;
  all.forEach((e,i)=>{
    const ang = (i/all.length)*Math.PI*2 - Math.PI/2;
    const r = 26 + (1-e.score)*14 + (i%3)*5;
    const x=cx+Math.cos(ang)*r*1.9, y=cy+Math.sin(ang)*r*0.62;
    const on = hits.includes(e.id);
    if(on) s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#4f6ef7" stroke-width="1" opacity=".5"/>`;
    s+=`<circle cx="${x}" cy="${y}" r="${on?4.6:3.2}" fill="${on?'#4f6ef7':'#c3ccdd'}" opacity="${on?1:.8}"/>`;
    if(on) s+=`<text x="${x+6}" y="${y+3}" font-size="8" fill="#4f6ef7">${e.id}</text>`;
  });
  (d.recall.hits||[]).slice(0,2).forEach((h,i)=>{
    s+=`<text x="10" y="${100-i*12}" font-size="8.5" fill="#7c8aa5">召回 ${h.id} · 相似度 ${h.sim} · 重排 ${h.rerank}</text>`;
  });
  $('#vec').innerHTML=s;
}
function renderCurve(){
  const W=760,H=168,L=44,R=14,T=16,B=34;
  const xs=i=>L+i*((W-L-R)/6), ys=v=>H-B-(v)* (H-T-B);
  const series=[
    {k:'fulfill_rate',n:'计划兑现率',c:'#4f6ef7'},
    {k:'energy_match', n:'精力匹配度',c:'#f59e0b'},
    {k:'cognition',    n:'系统认知分',c:'#7c5cff'},
  ];
  let s='';
  [0,.25,.5,.75,1].forEach(g=>{
    s+=`<line x1="${L}" y1="${ys(g)}" x2="${W-R}" y2="${ys(g)}" stroke="#eef2f8"/>`;
    s+=`<text x="${L-8}" y="${ys(g)+3.5}" font-size="9" fill="#a8b4c8" text-anchor="end">${g*100}%</text>`;
  });
  for(let i=0;i<7;i++){
    s+=`<text x="${xs(i)}" y="${H-12}" font-size="9.5" fill="#a8b4c8" text-anchor="middle">Day ${i+1}</text>`;
    if(i===S.day-1) s+=`<line x1="${xs(i)}" y1="${T-6}" x2="${xs(i)}" y2="${H-B}" stroke="#dbe3f2" stroke-dasharray="3 3"/>`;
  }
  series.forEach(se=>{

/* ============================ 逐日回放 ============================ */
function clearTimers(){ S.timers.forEach(clearTimeout); S.timers=[]; }
function at(ms,fn){ S.timers.push(setTimeout(fn,ms)); }
function playDay(day, speed=1){
  clearTimers(); closeOv(); S.day=day;
  document.querySelectorAll('.day').forEach(e=>e.classList.toggle('on',+e.dataset.d===day));
  document.querySelectorAll('.agent').forEach(e=>e.classList.remove('live','done'));
  render();
  const seq=[
    ['perception',0],['planner',620],['executor',1320],['reflector',2000]
  ];
  seq.forEach(([id,t],i)=>{
    at(t/speed,()=>{
      document.querySelectorAll('.agent').forEach(e=>e.classList.remove('live'));
      const el=$('#ag-'+id); if(el) el.classList.add('live');
      if(i>0){const p=AGENTS[i-1];const pe=$('#ag-'+p.id);if(pe)pe.classList.add('done');}
      if(i===0){
        // 感知阶段：先把原始信号铺满，让"看见"这件事有画面
        const d=S.d;
        at(0,()=>{$('#logbox').querySelectorAll('.logline').forEach((e,k)=>e.style.opacity=k?'0.25':'1');});
      }
    });
  });
  at(2500/speed,()=>{
    document.querySelectorAll('.agent').forEach(e=>{e.classList.remove('live');e.classList.add('done')});
    $('#logbox').querySelectorAll('.logline').forEach(e=>e.style.opacity=1);
  });
}

/* ---- 自动演示：节奏由真实配音时长决定 ---- */
let RAF=null;
function autoplay(){
  S.playing=true; $('#play').classList.add('on'); $('#play').textContent='■ 演示中';
  const t0=performance.now(); const fired={};
  const segs=NARR.segments;
  function tick(){
    const t=(performance.now()-t0)/1000;
    segs.forEach(s=>{
      if(t>=s.start && !fired[s.id]){ fired[s.id]=true; (SCENES[s.id]||(()=>{}))(); }
    });
    const cur=[...segs].reverse().find(s=>t>=s.start);
    if(cur){
      $('#sub').classList.add('on');
      $('#sub').innerHTML=cur.text;
    }
    if(t > NARR.total + 2.6){
      $('#sub').innerHTML='MeOS · 一个会"认识你"的个人 Agent 操作系统';
      S.playing=false; $('#play').textContent='▶ 重新演示';
      window.__T1__=performance.now(); window.__DONE__=true;
      return;
    }
    RAF=requestAnimationFrame(tick);
  }
  window.__T0__=performance.now();
  tick();
}

/* 供录屏脚本精确触发：外部调用 startDemo() 的那一刻就是视频的第 0 帧，
   同时把 T0/T1 暴露出去，事后就能算出录制起始到演示起始的偏移量。 */
window.startDemo = function(){ if(!S.playing) autoplay(); };
window.__TDUR__ = NARR.total;

/* ============================ 初始化 ============================ */
$('#ver').textContent = 'v0.1 MVP · '+DATA.meta.llm;
$('#days').innerHTML = DATA.days.map(d=>`<div class="day" data-d="${d.day}">${d.day}</div>`).join('');
$('#days').onclick = e => { const el=e.target.closest('.day');
  if(el){ cancelAnimationFrame(RAF); $('#sub').classList.remove('on'); $('#play').classList.remove('on');
    $('#play').textContent='▶ 自动演示'; S.playing=false; playDay(+el.dataset.d); } };
$('#play').onclick = () => { if(S.playing) return; autoplay(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeOv();
  if(e.key>='1'&&e.key<='7') playDay(+e.key); });
$('#ov').onclick = e => { if(e.target===$('#ov')) closeOv(); };

render();
playDay(1);
window.__READY__ = true;
</script>
